<main class="w-full flex gap-4 p-4 min-h-screen">
  <p-card class="w-72 h-full shadow-sm">
    <div class="flex flex-col gap-6">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider block mb-2 px-3">
          Painéis
        </span>
        <ul class="flex flex-col gap-1">
          <li>
            <a
              routerLink="/admin"
              routerLinkActive="text-green-400"
              [routerLinkActiveOptions]="{ exact: true }"
              class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-sm hover:text-green-400"
            >
              <i class="pi pi-home text-base"></i>
              <span>Administrativo</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/admin/profissionais"
              routerLinkActive="text-green-400"
              class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-sm hover:text-green-400"
            >
              <i class="pi pi-users text-base"></i>
              <span>Profissionais</span>
            </a>
          </li>
        </ul>
      </div>

      <div>
        <span class="text-xs font-semibold uppercase tracking-wider block mb-2 px-3"> Gestão </span>
        <ul class="flex flex-col gap-1">
          <li>
            <a
              routerLink="/admin/perfil"
              routerLinkActive="text-green-400"
              class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-sm hover:text-green-400"
            >
              <i class="pi pi-user text-base"></i>
              <span>Perfil</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </p-card>

  <div class="flex-1">
    <p-card class="w-full min-h-[calc(100vh-2rem)] shadow-sm">
      <router-outlet></router-outlet>
    </p-card>
  </div>
</main>
