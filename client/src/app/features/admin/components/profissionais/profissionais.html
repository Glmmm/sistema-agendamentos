<div class="w-full h-full flex flex-col justify-center items-center my-6">
  <h1 class="text-4xl font-bold mb-4">Profissionais</h1>
  <p class="text-lg text-gray-600">Gerencie os profissionais!</p>
</div>

<p-dialog [(visible)]="displayDialog" [modal]="true">
  <form [formGroup]="form" (ngSubmit)="cadastrarProfissional()" class="mb-6 p-4 rounded shadow-sm">
    <div class="flex flex-wrap gap-4 items-end justify-center">
      <div>
        <label for="nome" class="block text-sm font-medium text-gray-400 mb-1">Nome</label>
        <input
          pInputText
          id="nome"
          formControlName="nome"
          placeholder="Nome do profissional"
          class="w-full"
          pSize="small"
          type="text"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
        <input
          pInputText
          id="email"
          formControlName="email"
          placeholder="email@email.com"
          pSize="small"
          type="email"
          class="w-full"
        />
      </div>

      <div>
        <label for="telefone" class="block text-sm font-medium text-gray-400 mb-1">Telefone</label>
        <input
          pInputText
          pInputMask="(99) 99999-9999"
          id="telefone"
          formControlName="telefone"
          placeholder="(99) 99999-9999"
          pSize="small"
          type="text"
          class="w-full"
        />
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button (click)="displayDialog.set(false)" label="Cancelar" outlined="true"></p-button>
      <button
        pButton
        label="Salvar"
        type="submit"
        (click)="cadastrarProfissional()"
        [disabled]="form.invalid"
      ></button>
    </div>
  </ng-template>
</p-dialog>

<div class="w-full flex flex-col gap-4">
  <div class="flex justify-end">
    <p-button
      (click)="displayDialog.set(true)"
      icon="pi pi-user-plus"
      size="small"
      label="Adicionar Profissional"
      class="mb-4"
    >
    </p-button>
  </div>
  <div class="flex flex-wrap justify-evenly">
    @for (item of profissionais(); track $index) {
      <p-card>
        <div class="flex flex-col gap-4 p-4 rounded">
          <div>
            <p>{{ item.nome }}</p>
            <p>{{ item.email }}</p>
            <p>{{ item.telefone }}</p>
          </div>

          <div class="flex gap-2">
            <p-button
              (click)="visualizarServicos(item.id)"
              size="small"
              outlined="true"
              icon="pi pi-eye"
              label="Serviços"
            ></p-button>
            <p-button
              (click)="visualizarHorarios(item.id)"
              size="small"
              outlined="true"
              icon="pi pi-calendar"
              label="Horários"
            ></p-button>
            <div>
              <p-popover #op>
                <ng-template #content>
                  <div class="flex flex-col gap-2">
                    <p-button
                      (click)="editarProfissional(item)"
                      size="small"
                      text="true"
                      label="Editar"
                      icon="pi pi-pencil"
                    ></p-button>
                    <p-button
                      (click)="excluirProfissional(item.id)"
                      size="small"
                      text="true"
                      label="Deletar"
                      icon="pi pi-trash"
                    ></p-button>
                  </div>
                </ng-template>
              </p-popover>
              <p-button (click)="op.toggle($event)" size="small" icon="pi pi-bars"></p-button>
            </div>
          </div>
        </div>
      </p-card>
    }
  </div>
</div>
